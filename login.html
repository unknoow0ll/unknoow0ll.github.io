<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rævix.EX — Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --neon: #00ff41; --neon-dim: #00c832; --bg: #050508; }
    body {
      background: var(--bg);
      color: var(--neon);
      font-family: 'Courier New', monospace;
      height: 100vh; width: 100vw;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px);
      pointer-events: none;
      z-index: 9998;
    }
    #numStream {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      overflow: hidden;
    }
    .num-col {
      position: absolute;
      top: -100%;
      font-size: 12px;
      color: var(--neon-dim);
      opacity: 0.4;
      white-space: nowrap;
      writing-mode: vertical-rl;
      animation: numFall linear infinite;
    }
    @keyframes numFall {
      from { transform: translateY(-100%); }
      to   { transform: translateY(200vh); }
    }
    #loginBox {
      position: relative;
      z-index: 10;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    #logo {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 900;
      color: #fff;
      letter-spacing: 0.1em;
      text-shadow: 0 0 10px var(--neon), 0 0 30px var(--neon), 0 0 60px var(--neon), 0 0 100px #00ff4180;
      animation: logoPulse 3s ease-in-out infinite;
    }
    @keyframes logoPulse {
      0%,100% { text-shadow: 0 0 10px var(--neon), 0 0 30px var(--neon), 0 0 60px var(--neon); }
      50%      { text-shadow: 0 0 20px var(--neon), 0 0 50px var(--neon), 0 0 100px var(--neon), 0 0 150px #00ff4150; }
    }
    #loginLabel {
      font-size: 1rem;
      letter-spacing: 0.5em;
      color: var(--neon-dim);
    }
    #loginBtn {
      background: transparent;
      border: 1px solid var(--neon);
      color: var(--neon);
      font-family: 'Courier New', monospace;
      font-size: 1rem;
      letter-spacing: 0.4em;
      padding: 12px 40px;
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.2s, box-shadow 0.2s;
    }
    #loginBtn:hover {
      background: rgba(0,255,65,0.1);
      box-shadow: 0 0 20px rgba(0,255,65,0.5);
    }
  </style>
</head>
<body>

<div id="numStream"></div>

<div id="loginBox">
  <div id="logo">Rævix.EX</div>
  <div id="loginLabel">— LOGIN —</div>
  <button id="loginBtn" onclick="window.location.href='index.html'">[ ACCESS ]</button>
</div>

<script>
  const prefixes = ['+44','+31','+33','+212','+90','+49','+1','+39','+34','+55'];
  const stream = document.getElementById('numStream');
  for (let i = 0; i < 30; i++) {
    const col = document.createElement('div');
    col.className = 'num-col';
    col.style.top = '0';

    col.style.left = (i * 3.4) + '%';
    col.style.animationDuration = (8 + Math.random() * 10) + 's';
    col.style.animationDelay = (-Math.random() * 15) + 's';
    let txt = '';
    for (let j = 0; j < 20; j++) {
      txt += prefixes[Math.floor(Math.random() * prefixes.length)] + ' ';
      txt += Math.floor(Math.random() * 900 + 100) + ' ';
      txt += Math.floor(Math.random() * 9000 + 1000) + ' ';
      txt += Math.floor(Math.random() * 9000 + 1000) + '  ';
    }
    col.textContent = txt;
    stream.appendChild(col);
  }
</script>

</body>
</html>
